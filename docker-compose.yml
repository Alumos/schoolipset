services:
  schoolipset:
    image: ghcr.io/alumos/schoolipset:latest
    container_name: schoolipset
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "18080:18080"
      - "18081:18081"
    volumes:
      - schoolipset_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  schoolipset_data:
