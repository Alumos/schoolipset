name: CI · IP Sentinel

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  web:
    name: Web and API checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test -- --run
      - name: Build application
        run: npm run build
      - name: Build Docker image (pull request validation)
        if: github.event_name == 'pull_request'
        run: docker build --tag schoolipset:ci .

  docker:
    name: Publish one-piece server image
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alumos/schoolipset
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate image digest summary
        run: echo "Published ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"

  windows-client:
    name: Build Windows client
    needs: web
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build client
        run: dotnet build client/SchoolIpSet.Client/SchoolIpSet.Client.csproj --configuration Release
      - name: Package client
        # Inspect the embedded EXE manifest, not just the source manifest.
        shell: pwsh
        run: |
          $release = 'client/release'
          $source = 'client/SchoolIpSet.Client/bin/Release/net48/IP-Sentinel-Windows.exe'
          $target = Join-Path $release 'IP-Sentinel-Windows.exe'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          if (-not (Test-Path -LiteralPath $source)) {
            throw "未找到客户端构建产物: $source"
          }
          $mt = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/mt.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool missing' }
          & $mt.FullName "-inputresource:$source;#1" "-out:$release/embedded.manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract EXE manifest' }
          [xml]$manifest = Get-Content "$release/embedded.manifest" -Raw
          $level = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']").GetAttribute('level')
          if ($level -ne 'requireAdministrator') { throw "Incorrect EXE privilege level: $level" }
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          "IP-Sentinel-Windows.exe  $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "Single-file client: $target"
          Write-Host "SHA-256: $hash"
      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: IP-Sentinel-Windows-${{ github.sha }}
          path: client/release/IP-Sentinel-Windows.exe
      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" client/release/IP-Sentinel-Windows.exe --title "IP Sentinel ${{ github.ref_name }}" --generate-notes
